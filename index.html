<!DOCTYPE html>
<html lang="ro" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <title>GDPR Rapid - Conformitate IMM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      @media print {
        @page { margin: 2cm; }
        body { background: white; color: black; }
        .no-print { display: none !important; }
        /* Reset prose colors for print */
        .prose { color: black !important; max-width: none !important; }
        .prose h1, .prose h2, .prose h3 { color: black !important; }
        .prose p { color: black !important; }
      }
    </style>
<link rel="stylesheet" href="/index.css">
